name: Build Extension Zip
on:
  workflow_call:
    inputs:
      extensionName:
        description: "Your extension name"
        required: true
        type: string
      path:
        description: "Path to your bundle"
        required: false
        type: string
        default: "."
jobs:
  run:
    name: Build and Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shopware-cli
        uses: shopware/shopware-cli-action@v3
      - name: Build
        run: shopware-cli extension zip "${{ inputs.path }}" --git-commit "${{ github.sha }}" --release
      - name: Rename
        run: mv ${{ inputs.extensionName }}-${{ github.sha }}.zip ${{ inputs.extensionName }}.zip
      - name: Validate
        run: shopware-cli extension validate ${{ inputs.extensionName }}.zip --only sw-cli
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.extensionName }}
          path: ${{ inputs.extensionName }}.zip
